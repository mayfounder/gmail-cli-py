[project]
name = "gmail-cli-py"
version = "0.1.0"
description = "CLI for reading Gmail from multiple accounts (Python port of gmail-cli)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "textual>=0.80.0",
    "presidio-analyzer>=2.2.363",
    "presidio-anonymizer>=2.2.363",
]

[project.scripts]
gmail-cli-py = "gmail_cli_py.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "spacy>=3.8.0",
    "thinc>=8.3.13",
    "blis>=1.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gmail_cli_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
